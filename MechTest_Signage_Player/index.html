<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1">

<title>MechTest Digital Signage</title>


<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  font-family: Arial, Helvetica, sans-serif;
  overflow: hidden;
  background: #07121f;
}


/* =========================================================
   MAIN SIGNAGE LAYOUT
========================================================= */

.stage {
  width: 100vw;
  height: 100vh;

  display: flex;
  flex-direction: column;

  background: #07121f;
}


/* =========================================================
   TOP MEDIA AREA
========================================================= */

#mediaArea {
  width: 100%;
  height: 70vh;

  display: grid;

  grid-template-columns:
    20vw
    minmax(0, 1fr)
    20vw;

  background: #000;

  overflow: hidden;
}


/* =========================================================
   LEFT INFORMATION PANEL
========================================================= */

#infoPanel {
  width: 20vw;
  height: 100%;

  background:
    linear-gradient(
      180deg,
      #07121f 0%,
      #0b1d30 100%
    );

  border-right:
    1px solid
    rgba(255,255,255,.10);

  color: #ffffff;

  display: grid;

  grid-template-rows:
    56% 44%;

  overflow: hidden;
}


/* =========================================================
   LEFT PANEL SECTIONS
========================================================= */

.info-section {
  padding:
    1.8vh
    1.15vw;

  overflow: hidden;
}

.announcement-section {
  border-bottom:
    1px solid
    rgba(255,255,255,.12);
}

.info-title {
  font-size: clamp(18px, 1.2vw, 24px);
  font-weight: 800;

  letter-spacing: .05em;

  text-transform: uppercase;

  text-align: center;

  color: #ffffff;
}

.info-subtitle {
  margin-top: .3vh;

  font-size: clamp(11px, .68vw, 15px);

  color: #8ea6bd;

  text-align: center;
}


/* =========================================================
   ANNOUNCEMENTS
========================================================= */

#announcementList {
  margin-top: 1.2vh;

  display: flex;
  flex-direction: column;

  gap: .65vh;
}

.announcement-item {
  display: flex;

  align-items: flex-start;

  gap: .55vw;

  padding-bottom: .55vh;

  border-bottom:
    1px solid
    rgba(255,255,255,.07);
}

.announcement-icon {
  width: .52vw;
  height: .52vw;

  min-width: .52vw;

  margin-top: .42vh;

  border-radius: 50%;

  background: #22b455;
}

.announcement-text {
  font-size: clamp(15px, .95vw, 19px);

  line-height: 1.28;

  font-weight: 600;

  color: #e8f0f7;
}


/* =========================================================
   PUBLIC HOLIDAYS
========================================================= */

#holidayList {
  margin-top: .9vh;

  display: flex;
  flex-direction: column;

  gap: .55vh;
}

.holiday-item {
  display: flex;

  justify-content: space-between;
  align-items: center;

  gap: .55vw;

  padding-bottom: .45vh;

  border-bottom:
    1px solid
    rgba(255,255,255,.07);
}

.holiday-name {
  min-width: 0;

  font-size: clamp(14px, .9vw, 18px);

  line-height: 1.2;

  font-weight: 600;

  color: #e8f0f7;
}

.holiday-date-wrap {
  flex-shrink: 0;

  text-align: right;
}

.holiday-date {
  font-size: clamp(14px, .9vw, 18px);

  font-weight: 800;

  color: #22b455;
}

.holiday-days {
  margin-top: .1vh;

  font-size: clamp(11px, .65vw, 14px);

  color: #8ea6bd;
}


/* =========================================================
   EMPTY PANEL MESSAGE
========================================================= */

.empty-message {
  margin-top: 1.5vh;

  font-size: clamp(12px, .7vw, 15px);

  text-align: center;

  color: #7f96ab;
}


/* =========================================================
   VIDEO AREA
========================================================= */

#videoArea {
  width: 100%;
  height: 100%;

  min-width: 0;

  background: #000;

  display: flex;
  align-items: center;
  justify-content: center;

  overflow: hidden;
}

#signageVideo {
  width: 100%;
  height: 100%;

  object-fit: contain;
  object-position: center center;

  background: #000;

  display: block;
}


/* =========================================================
   JOBS IN PROGRESS PANEL
========================================================= */

#jobsPanel {
  width: 20vw;
  height: 100%;

  padding:
    2vh
    1.1vw
    1.4vh;

  background:
    linear-gradient(
      180deg,
      #07121f 0%,
      #0b1d30 100%
    );

  border-left:
    1px solid
    rgba(255,255,255,.10);

  color: #ffffff;

  display: flex;
  flex-direction: column;

  overflow: hidden;
}


/* =========================================================
   JOBS PANEL HEADER
========================================================= */

.jobs-title {
  font-size: clamp(18px, 1.2vw, 24px);
  font-weight: 800;

  letter-spacing: .06em;

  color: #ffffff;

  text-transform: uppercase;

  text-align: center;
}

.jobs-subtitle {
  margin-top: .3vh;

  font-size: clamp(11px, .7vw, 15px);

  color: #8ea6bd;

  text-align: center;
}


/* =========================================================
   TOTAL ACTIVE JOBS
========================================================= */

.jobs-total-wrap {
  margin:
    1.1vh 0
    1.1vh;

  text-align: center;
}

.jobs-total {
  font-size: clamp(44px, 3.4vw, 64px);
  line-height: 1;

  font-weight: 900;

  color: #22b455;
}

.jobs-total-label {
  margin-top: .35vh;

  font-size: clamp(12px, .75vw, 16px);

  font-weight: 700;

  color: #a9bbcc;

  text-transform: uppercase;

  letter-spacing: .05em;
}


/* =========================================================
   JOBS DIVIDER
========================================================= */

.jobs-divider {
  height: 1px;

  width: 100%;

  background:
    rgba(255,255,255,.12);

  margin-bottom: 1vh;
}


/* =========================================================
   JOB LIST
========================================================= */

#jobsList {
  width: 100%;

  flex: 1;

  display: flex;
  flex-direction: column;

  justify-content: flex-start;

  gap: .95vh;

  overflow: hidden;
}

.job-item {
  width: 100%;
}

.job-row {
  display: flex;

  align-items: flex-end;
  justify-content: space-between;

  gap: .6vw;

  padding-right: .45vw;
}

.job-name {
  min-width: 0;

  font-size: clamp(14px, .88vw, 18px);

  line-height: 1.2;

  font-weight: 600;

  color: #e8f0f7;
}

.job-count {
  flex-shrink: 0;

  font-size: clamp(16px, 1vw, 20px);

  line-height: 1;

  font-weight: 800;

  color: #ffffff;
}


/* =========================================================
   JOB WORKLOAD BAR
========================================================= */

.job-bar {
  width: 100%;
  height: .32vh;

  margin-top: .4vh;

  border-radius: 999px;

  background:
    rgba(255,255,255,.10);

  overflow: hidden;
}

.job-bar-fill {
  height: 100%;

  min-width: 0;

  border-radius: inherit;

  background:
    linear-gradient(
      90deg,
      #159447,
      #22b455
    );

  transition:
    width .4s ease;
}


/* =========================================================
   JOBS LIVE STATUS
========================================================= */

.jobs-live {
  margin-top: .8vh;

  padding-top: .8vh;

  border-top:
    1px solid
    rgba(255,255,255,.08);

  display: flex;

  justify-content: center;
  align-items: center;

  gap: .35vw;

  font-size: clamp(10px, .6vw, 13px);

  color: #7f96ab;
}

.jobs-live-dot {
  width: .42vw;
  height: .42vw;

  border-radius: 50%;

  background: #22b455;
}


/* =========================================================
   SALES DASHBOARD
========================================================= */

#dashboard {
  width: 100%;
  height: 30vh;

  background:
    linear-gradient(
      135deg,
      #f8fbff,
      #eef4fb
    );

  color: #102642;

  padding: .75vh 2vw;

  overflow: hidden;
}


/* =========================================================
   DASHBOARD HEADER
========================================================= */

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;

  margin-bottom: .45vh;
}

.title {
  font-size: 1.45vw;
  font-weight: 800;
  letter-spacing: .02em;
}

.sub {
  font-size: .7vw;
  color: #5c6f85;
}


/* =========================================================
   MECHTEST LOGO
========================================================= */

.logo-wrap {
  display: flex;
  align-items: center;
  justify-content: flex-end;
}

.logo-wrap img {
  height: 3.7vh;
  width: auto;
  max-width: 14vw;

  object-fit: contain;

  display: block;
}


/* =========================================================
   DASHBOARD GRID
========================================================= */

.grid {
  display: grid;

  grid-template-columns:
    repeat(5, 1fr);

  gap: .8vw;
}


/* =========================================================
   DASHBOARD CARDS
========================================================= */

.card {
  background: white;

  border-radius: .7vw;

  padding: .38vw .45vw;

  text-align: center;

  box-shadow:
    0 4px 12px
    rgba(18,45,75,.10);
}

.label {
  font-size: .72vw;
  font-weight: 700;

  min-height: 1.8em;

  display: flex;
  align-items: center;
  justify-content: center;
}

.value {
  font-size: 1.3vw;
  font-weight: 800;

  margin:
    .08vw 0
    .12vw;

  color: #159447;
}


/* =========================================================
   NORMAL SINGLE RING
========================================================= */

.ring {
  --p: 0;

  width: 3.3vw;
  height: 3.3vw;

  border-radius: 50%;

  margin:
    0 auto .15vw;

  background:
    conic-gradient(
      #22b455
      calc(var(--p) * 1%),

      #e4ebf1 0
    );

  position: relative;
}

.ring:after {
  content: "";

  position: absolute;

  inset: .45vw;

  border-radius: 50%;

  background: #fff;
}


/* =========================================================
   DOUBLE RING
========================================================= */

.double-ring {
  position: relative;

  width: 4.25vw;
  height: 4.25vw;

  margin:
    .02vw auto
    .08vw;
}


/* =========================================================
   OUTER INVOICE RING
========================================================= */

.invoice-ring {
  --invoice: 0;

  position: absolute;

  inset: 0;

  border-radius: 50%;

  background:
    conic-gradient(
      #22b455
      calc(var(--invoice) * 1%),

      #e5eaf0 0
    );

  z-index: 1;
}

.invoice-ring:after {
  content: "";

  position: absolute;

  inset: .36vw;

  border-radius: 50%;

  background: #fff;
}


/* =========================================================
   INNER TIME RING
========================================================= */

.time-ring {
  --time: 0;

  position: absolute;

  inset: .67vw;

  border-radius: 50%;

  background:
    conic-gradient(
      #7393b3
      calc(var(--time) * 1%),

      #e5eaf0 0
    );

  z-index: 2;
}

.time-ring:after {
  content: "";

  position: absolute;

  inset: .34vw;

  border-radius: 50%;

  background: #fff;
}


/* =========================================================
   CENTRE VALUE
========================================================= */

.ring-center {
  position: absolute;

  inset: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  z-index: 5;

  font-size: .64vw;
  font-weight: 800;

  color: #7393b3;
}


/* =========================================================
   DOUBLE RING LEGEND
========================================================= */

.ring-legend {
  margin-top: .05vw;

  display: flex;
  justify-content: center;
  align-items: center;

  gap: .45vw;

  font-size: .52vw;

  color: #607489;
}

.legend-item {
  display: flex;
  align-items: center;

  gap: .16vw;
}

.legend-dot {
  width: .36vw;
  height: .36vw;

  border-radius: 50%;
}

.legend-time {
  background: #7393b3;
}

.legend-progress {
  background: #22b455;
}


/* =========================================================
   AHEAD / BEHIND
========================================================= */

.schedule-status {
  margin-top: .08vw;

  font-size: .6vw;
  font-weight: 800;
}

.schedule-status.ahead {
  color: #159447;
}

.schedule-status.behind {
  color: #c62828;
}

.schedule-status.ontrack {
  color: #607489;
}


/* =========================================================
   FOOTER
========================================================= */

.foot {
  margin-top: .18vh;

  display: flex;
  justify-content: space-between;
  align-items: center;

  color: #607489;

  font-size: .6vw;
}

.status {
  display: flex;
  align-items: center;

  gap: .35vw;
}

.dot {
  width: .4vw;
  height: .4vw;

  border-radius: 50%;

  background: #25b05b;
}

#error {
  color: #b42318;
}

</style>

</head>


<body>


<div class="stage">


  <div id="mediaArea">


    <aside id="infoPanel">


      <section
        class="info-section announcement-section">

        <div class="info-title">
          Company Announcements
        </div>

        <div class="info-subtitle">
          Latest staff updates
        </div>

        <div id="announcementList"></div>

      </section>


      <section class="info-section">

        <div class="info-title">
          Upcoming Public Holidays
        </div>

        <div class="info-subtitle">
          Queensland
        </div>

        <div id="holidayList"></div>

      </section>


    </aside>


    <div id="videoArea">

      <video
        id="signageVideo"
        autoplay
        playsinline
        preload="auto">
      </video>

    </div>


    <aside id="jobsPanel">


      <div class="jobs-title">
        Jobs in Progress
      </div>


      <div class="jobs-subtitle">
        Current active workload
      </div>


      <div class="jobs-total-wrap">

        <div
          class="jobs-total"
          id="jobsTotal">

          0

        </div>


        <div class="jobs-total-label">
          Total Active Jobs
        </div>

      </div>


      <div class="jobs-divider"></div>


      <div id="jobsList"></div>


      <div class="jobs-live">

        <span class="jobs-live-dot"></span>

        <span>
          Live Raised Job
        </span>

      </div>


    </aside>


  </div>


  <section id="dashboard">


    <div class="top">


      <div>

        <div class="title">
          SALES PROGRESS DASHBOARD
        </div>

        <div class="sub">
          Live percentages from current fiscal year 2026-2027
        </div>

      </div>


      <div class="logo-wrap">

        <img
          src="./mechtest-logo.PNG"
          alt="MechTest Logo">

      </div>


    </div>


    <div
      class="grid"
      id="cards">
    </div>


    <div class="foot">


      <div class="status">

        <span class="dot"></span>

        <span id="sync">
          Connecting to Google Sheets...
        </span>

      </div>


      <div id="clock"></div>


    </div>


  </section>


</div>



<script>


const API_URL =
  "https://script.google.com/macros/s/AKfycbyPPC5ODQA1QdqN8P7pc4lJvd4vR2fJTzFcSoMfKr8F_F3F1Iotc1hInjBKJXJ1xrIL/exec";


const REFRESH_MS =
  10000;


const STORAGE_KEY =
  "mechtestDashboardApiData";


const defaults = [

  ["Monthly Target", 100],

  ["Quarterly Target", 100],

  ["Annual Target", 100],

  ["Quarterly Bonus", 100],

  ["Annual Bonus", 100]

];


let data =
  defaults.slice();


const jobsOrder = [

  "Materials Testing",

  "Mechanical Engineering",

  "CCS",

  "FACE Consulting",

  "NDTIC"

];


let jobsInProgress = {

  "CCS": 0,

  "FACE Consulting": 0,

  "Materials Testing": 0,

  "Mechanical Engineering": 0,

  "NDTIC": 0

};


let totalJobsInProgress =
  0;


let announcements =
  [];


let publicHolidays =
  [];


let currentSignature =
  "";

let lastApiGeneratedAt =
  "";


const signagePlaylist = [

  "https://github.com/marctanabc/Mechtest-Dashboard/releases/download/signage-v2/Ad1.mp4",

  "https://github.com/marctanabc/Mechtest-Dashboard/releases/download/signage-v2/Ad2.mp4",

  "https://github.com/marctanabc/Mechtest-Dashboard/releases/download/signage-v2/Ad3.mp4"

];


let currentVideoIndex =
  0;


const signageVideo =
  document.getElementById(
    "signageVideo"
  );


function playCurrentAd() {

  const videoUrl =
    signagePlaylist[
      currentVideoIndex
    ];


  signageVideo.pause();

  signageVideo.src =
    videoUrl;

  signageVideo.currentTime =
    0;

  signageVideo.muted =
    false;

  signageVideo.volume =
    1;

  signageVideo.load();


  const playPromise =
    signageVideo.play();


  if (
    playPromise !== undefined
  ) {

    playPromise.catch(
      error => {

        console.error(
          "Video autoplay with sound was blocked:",
          error
        );


        document.body.addEventListener(
          "click",
          startVideoAfterClick,
          {
            once: true
          }
        );

      }
    );

  }

}


function startVideoAfterClick() {

  signageVideo.muted =
    false;

  signageVideo.volume =
    1;


  signageVideo
    .play()
    .catch(
      error => {

        console.error(
          "Video playback failed:",
          error
        );

      }
    );

}


function playNextAd() {

  currentVideoIndex =
    (
      currentVideoIndex + 1
    ) %
    signagePlaylist.length;


  playCurrentAd();

}


signageVideo.addEventListener(
  "ended",
  playNextAd
);


signageVideo.addEventListener(
  "error",
  function () {

    setTimeout(
      playNextAd,
      2000
    );

  }
);


function clampPercent(
  value
) {

  return Math.max(
    0,
    Math.min(
      100,
      Number(value) || 0
    )
  );

}


function getMonthElapsedPercent() {

  const now =
    new Date();


  const start =
    new Date(
      now.getFullYear(),
      now.getMonth(),
      1
    );


  const end =
    new Date(
      now.getFullYear(),
      now.getMonth() + 1,
      1
    );


  return clampPercent(
    (
      (now - start) /
      (end - start)
    ) *
    100
  );

}


function getQuarterElapsedPercent() {

  const now =
    new Date();


  const year =
    now.getFullYear();


  const month =
    now.getMonth();


  let quarterStartMonth;
  let quarterStartYear;


  if (
    month >= 6 &&
    month <= 8
  ) {

    quarterStartMonth = 6;
    quarterStartYear = year;

  }

  else if (
    month >= 9 &&
    month <= 11
  ) {

    quarterStartMonth = 9;
    quarterStartYear = year;

  }

  else if (
    month >= 0 &&
    month <= 2
  ) {

    quarterStartMonth = 0;
    quarterStartYear = year;

  }

  else {

    quarterStartMonth = 3;
    quarterStartYear = year;

  }


  const start =
    new Date(
      quarterStartYear,
      quarterStartMonth,
      1
    );


  const end =
    new Date(
      quarterStartYear,
      quarterStartMonth + 3,
      1
    );


  return clampPercent(
    (
      (now - start) /
      (end - start)
    ) *
    100
  );

}


function getFiscalYearElapsedPercent() {

  const now =
    new Date();


  const year =
    now.getFullYear();


  const month =
    now.getMonth();


  const fiscalStartYear =
    month >= 6
      ? year
      : year - 1;


  const start =
    new Date(
      fiscalStartYear,
      6,
      1
    );


  const end =
    new Date(
      fiscalStartYear + 1,
      6,
      1
    );


  return clampPercent(
    (
      (now - start) /
      (end - start)
    ) *
    100
  );

}


function getTimeElapsedPercent(
  label
) {

  switch (label) {

    case "Monthly Target":
      return getMonthElapsedPercent();

    case "Quarterly Target":
      return getQuarterElapsedPercent();

    case "Annual Target":
      return getFiscalYearElapsedPercent();

    default:
      return null;

  }

}


function usesDoubleRing(
  label
) {

  return (
    label === "Monthly Target" ||
    label === "Quarterly Target" ||
    label === "Annual Target"
  );

}


function getScheduleStatus(
  progressPercent,
  timePercent
) {

  const difference =
    progressPercent -
    timePercent;


  if (
    difference > 1
  ) {

    return {
      className: "ahead",
      text:
        "Ahead by " +
        difference.toFixed(1) +
        "%"
    };

  }


  if (
    difference < -1
  ) {

    return {
      className: "behind",
      text:
        "Behind by " +
        Math.abs(
          difference
        ).toFixed(1) +
        "%"
    };

  }


  return {
    className: "ontrack",
    text: "On track"
  };

}


function renderDashboard() {

  const cards =
    document.getElementById(
      "cards"
    );


  cards.innerHTML =
    "";


  data.forEach(
    ([label, pct]) => {

      pct =
        clampPercent(
          pct
        );


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "card";


      if (
        usesDoubleRing(label)
      ) {

        const timePercent =
          clampPercent(
            getTimeElapsedPercent(
              label
            )
          );


        const schedule =
          getScheduleStatus(
            pct,
            timePercent
          );


        card.innerHTML = `

          <div class="label">
            ${label}
          </div>

          <div class="value">
            ${pct.toFixed(1)}%
          </div>

          <div class="double-ring">

            <div
              class="invoice-ring"
              style="--invoice:${pct}">
            </div>

            <div
              class="time-ring"
              style="--time:${timePercent}">
            </div>

            <div class="ring-center">
              ${timePercent.toFixed(0)}%
            </div>

          </div>

          <div class="ring-legend">

            <div class="legend-item">
              <span
                class="legend-dot legend-time">
              </span>

              Time ${timePercent.toFixed(0)}%
            </div>

            <div class="legend-item">
              <span
                class="legend-dot legend-progress">
              </span>

              Invoice ${pct.toFixed(0)}%
            </div>

          </div>

          <div
            class="schedule-status ${schedule.className}">

            ${schedule.text}

          </div>
        `;

      }

      else {

        card.innerHTML = `

          <div class="label">
            ${label}
          </div>

          <div class="value">
            ${pct.toFixed(1)}%
          </div>

          <div
            class="ring"
            style="--p:${pct}">
          </div>

          <div class="sub">
            Progress
          </div>
        `;

      }


      cards.appendChild(
        card
      );

    }
  );

}


function renderJobsInProgress() {

  const totalElement =
    document.getElementById(
      "jobsTotal"
    );


  const jobsList =
    document.getElementById(
      "jobsList"
    );


  totalJobsInProgress =
    jobsOrder.reduce(
      (total, name) =>
        total +
        (
          Number(
            jobsInProgress[name]
          ) || 0
        ),
      0
    );


  totalElement.textContent =
    totalJobsInProgress.toLocaleString();


  jobsList.innerHTML =
    "";


  const maxJobs =
    Math.max(
      1,
      ...jobsOrder.map(
        name =>
          Number(
            jobsInProgress[name]
          ) || 0
      )
    );


  jobsOrder.forEach(
    name => {

      const count =
        Math.max(
          0,
          Number(
            jobsInProgress[name]
          ) || 0
        );


      const barWidth =
        (
          count /
          maxJobs
        ) *
        100;


      const item =
        document.createElement(
          "div"
        );


      item.className =
        "job-item";


      item.innerHTML = `

        <div class="job-row">

          <div class="job-name">
            ${name}
          </div>

          <div class="job-count">
            ${count.toLocaleString()}
          </div>

        </div>

        <div class="job-bar">

          <div
            class="job-bar-fill"
            style="width:${barWidth}%">
          </div>

        </div>
      `;


      jobsList.appendChild(
        item
      );

    }
  );

}


function renderAnnouncements() {

  const list =
    document.getElementById(
      "announcementList"
    );


  list.innerHTML =
    "";


  if (
    !Array.isArray(announcements) ||
    announcements.length === 0
  ) {

    list.innerHTML = `
      <div class="empty-message">
        No current announcements
      </div>
    `;

    return;

  }


  announcements
    .slice(0, 5)
    .forEach(
      text => {

        const item =
          document.createElement(
            "div"
          );


        item.className =
          "announcement-item";


        item.innerHTML = `

          <span class="announcement-icon">
          </span>

          <div class="announcement-text">
            ${text}
          </div>
        `;


        list.appendChild(
          item
        );

      }
    );

}


function parseHolidayDate(
  dateText
) {

  if (
    !dateText
  ) {

    return null;

  }


  const months = {

    jan: 0,
    feb: 1,
    mar: 2,
    apr: 3,
    may: 4,
    jun: 5,
    jul: 6,
    aug: 7,
    sep: 8,
    oct: 9,
    nov: 10,
    dec: 11

  };


  const parts =
    String(dateText)
      .trim()
      .split(/\s+/);


  if (
    parts.length !== 3
  ) {

    return null;

  }


  const day =
    parseInt(
      parts[0],
      10
    );


  const month =
    months[
      parts[1]
        .substring(0, 3)
        .toLowerCase()
    ];


  const year =
    parseInt(
      parts[2],
      10
    );


  if (
    Number.isNaN(day) ||
    month === undefined ||
    Number.isNaN(year)
  ) {

    return null;

  }


  return new Date(
    year,
    month,
    day,
    0,
    0,
    0,
    0
  );

}


function formatHolidayDate(
  date
) {

  return date.toLocaleDateString(
    "en-AU",
    {
      day: "numeric",
      month: "short",
      year: "numeric"
    }
  );

}


function renderPublicHolidays() {

  const list =
    document.getElementById(
      "holidayList"
    );


  list.innerHTML =
    "";


  const today =
    new Date();


  today.setHours(
    0,
    0,
    0,
    0
  );


  const upcoming =
    publicHolidays

      .map(
        holiday => {

          const parsedDate =
            parseHolidayDate(
              holiday.date
            );


          return {

            name:
              holiday.name,

            date:
              parsedDate

          };

        }
      )

      .filter(
        holiday =>
          holiday.name &&
          holiday.date &&
          holiday.date >= today
      )

      .sort(
        (a, b) =>
          a.date - b.date
      )

      .slice(
        0,
        4
      );


  if (
    upcoming.length === 0
  ) {

    list.innerHTML = `
      <div class="empty-message">
        No upcoming holidays
      </div>
    `;

    return;

  }


  upcoming.forEach(
    holiday => {

      const difference =
        holiday.date -
        today;


      const daysAway =
        Math.ceil(
          difference /
          (
            1000 *
            60 *
            60 *
            24
          )
        );


      let daysText;


      if (
        daysAway === 0
      ) {

        daysText =
          "Today";

      }

      else if (
        daysAway === 1
      ) {

        daysText =
          "Tomorrow";

      }

      else {

        daysText =
          daysAway +
          " days away";

      }


      const item =
        document.createElement(
          "div"
        );


      item.className =
        "holiday-item";


      item.innerHTML = `

        <div class="holiday-name">
          ${holiday.name}
        </div>

        <div class="holiday-date-wrap">

          <div class="holiday-date">
            ${formatHolidayDate(
              holiday.date
            )}
          </div>

          <div class="holiday-days">
            ${daysText}
          </div>

        </div>
      `;


      list.appendChild(
        item
      );

    }
  );

}


function createDataSignature(
  salesDataset,
  jobsDataset,
  announcementDataset,
  holidayDataset
) {

  return JSON.stringify(
    {

      sales:
        salesDataset,

      jobs:
        jobsDataset,

      announcements:
        announcementDataset,

      holidays:
        holidayDataset

    }
  );

}


function saveCurrentData(
  salesDataset,
  jobsDataset,
  announcementDataset,
  holidayDataset,
  generatedAt
) {

  try {

    localStorage.setItem(

      STORAGE_KEY,

      JSON.stringify(
        {

          data:
            salesDataset,

          jobsInProgress:
            jobsDataset,

          announcements:
            announcementDataset,

          publicHolidays:
            holidayDataset,

          generatedAt:
            generatedAt || "",

          savedAt:
            Date.now()

        }
      )

    );

  }

  catch (
    error
  ) {

    console.warn(
      "Unable to save dashboard data:",
      error
    );

  }

}


function restoreCurrentData() {

  try {

    const saved =
      localStorage.getItem(
        STORAGE_KEY
      );


    if (
      !saved
    ) {

      return;

    }


    const parsed =
      JSON.parse(
        saved
      );


    if (
      !parsed ||
      !Array.isArray(
        parsed.data
      ) ||
      parsed.data.length !== 5
    ) {

      return;

    }


    data =
      parsed.data;


    if (
      parsed.jobsInProgress &&
      typeof parsed.jobsInProgress ===
        "object"
    ) {

      jobsInProgress = {

        ...jobsInProgress,

        ...parsed.jobsInProgress

      };

    }


    if (
      Array.isArray(
        parsed.announcements
      )
    ) {

      announcements =
        parsed.announcements;

    }


    if (
      Array.isArray(
        parsed.publicHolidays
      )
    ) {

      publicHolidays =
        parsed.publicHolidays;

    }


    currentSignature =
      createDataSignature(
        data,
        jobsInProgress,
        announcements,
        publicHolidays
      );


    lastApiGeneratedAt =
      parsed.generatedAt || "";

  }

  catch (
    error
  ) {

    console.warn(
      "Unable to restore dashboard values:",
      error
    );

  }

}


function applyData(
  newData,
  newJobs,
  newAnnouncements,
  newHolidays,
  generatedAt
) {

  data =
    newData;


  jobsInProgress = {

    ...jobsInProgress,

    ...newJobs

  };


  announcements =
    newAnnouncements;


  publicHolidays =
    newHolidays;


  currentSignature =
    createDataSignature(
      data,
      jobsInProgress,
      announcements,
      publicHolidays
    );


  lastApiGeneratedAt =
    generatedAt || "";


  saveCurrentData(
    data,
    jobsInProgress,
    announcements,
    publicHolidays,
    generatedAt
  );


  renderDashboard();

  renderJobsInProgress();

  renderAnnouncements();

  renderPublicHolidays();

}


async function fetchSheetData() {

  const requestUrl =
    API_URL +
    "?_ts=" +
    Date.now();


  const response =
    await fetch(
      requestUrl,
      {
        method: "GET",
        cache: "no-store"
      }
    );


  if (
    !response.ok
  ) {

    throw new Error(
      "API HTTP " +
      response.status
    );

  }


  const result =
    await response.json();


  if (
    !result ||
    result.ok !== true
  ) {

    throw new Error(
      result &&
      result.error
        ? result.error
        : "Invalid API response"
    );

  }


  if (
    !result.metrics ||
    typeof result.metrics !== "object"
  ) {

    throw new Error(
      "API response has no metrics object"
    );

  }


  const newData =
    [];


  for (
    const [name] of defaults
  ) {

    if (
      !Object.prototype.hasOwnProperty.call(
        result.metrics,
        name
      )
    ) {

      throw new Error(
        "Missing API metric: " +
        name
      );

    }


    const value =
      Number(
        result.metrics[name]
      );


    if (
      !Number.isFinite(
        value
      )
    ) {

      throw new Error(
        "Invalid API value for " +
        name
      );

    }


    newData.push(
      [
        name,
        clampPercent(
          value
        )
      ]
    );

  }


  const newJobs = {

    ...jobsInProgress

  };


  if (
    result.jobsInProgress &&
    typeof result.jobsInProgress ===
      "object"
  ) {

    jobsOrder.forEach(
      name => {

        if (
          Object.prototype.hasOwnProperty.call(
            result.jobsInProgress,
            name
          )
        ) {

          const value =
            Number(
              result.jobsInProgress[
                name
              ]
            );


          if (
            Number.isFinite(
              value
            )
          ) {

            newJobs[name] =
              Math.max(
                0,
                Math.round(
                  value
                )
              );

          }

        }

      }
    );

  }


  const newAnnouncements =
    Array.isArray(
      result.announcements
    )
      ? result.announcements
      : announcements;


  const newHolidays =
    Array.isArray(
      result.publicHolidays
    )
      ? result.publicHolidays
      : publicHolidays;


  return {

    data:
      newData,

    jobs:
      newJobs,

    announcements:
      newAnnouncements,

    holidays:
      newHolidays,

    generatedAt:
      result.generatedAt || ""

  };

}


async function loadSheet() {

  const sync =
    document.getElementById(
      "sync"
    );


  try {

    const apiResult =
      await fetchSheetData();


    const newSignature =
      createDataSignature(
        apiResult.data,
        apiResult.jobs,
        apiResult.announcements,
        apiResult.holidays
      );


    if (
      newSignature !==
      currentSignature
    ) {

      applyData(
        apiResult.data,
        apiResult.jobs,
        apiResult.announcements,
        apiResult.holidays,
        apiResult.generatedAt
      );


      sync.textContent =
        "Updated " +
        new Date()
          .toLocaleTimeString();

    }

    else {

      lastApiGeneratedAt =
        apiResult.generatedAt || "";


      sync.textContent =
        "Live sync " +
        new Date()
          .toLocaleTimeString();

    }

  }

  catch (
    error
  ) {

    console.error(
      "Apps Script API sync error:",
      error
    );


    sync.innerHTML =

      '<span id="error">' +

      'API sync unavailable - showing last known data' +

      '</span>';

  }

}


function updateClock() {

  document
    .getElementById(
      "clock"
    )
    .textContent =

      new Date()
        .toLocaleString(
          "en-AU"
        );

}


setInterval(
  updateClock,
  1000
);


restoreCurrentData();


renderDashboard();

renderJobsInProgress();

renderAnnouncements();

renderPublicHolidays();


loadSheet();


setInterval(
  loadSheet,
  REFRESH_MS
);


updateClock();


playCurrentAd();


</script>
