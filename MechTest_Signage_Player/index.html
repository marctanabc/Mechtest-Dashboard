<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>MechTest Digital Signage</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  font-family: Arial, Helvetica, sans-serif;
  overflow: hidden;
  background: #07121f;
}

/* =========================================================
   MAIN SIGNAGE LAYOUT
========================================================= */

.stage {
  width: 100vw;
  height: 100vh;

  display: flex;
  flex-direction: column;

  background: #07121f;
}


/* =========================================================
   VIDEO AREA
========================================================= */

#videoArea {
  width: 100%;
  height: 65vh;

  background: #000;

  display: flex;
  align-items: center;
  justify-content: center;

  overflow: hidden;
}

#signageVideo {
  width: 100%;
  height: 100%;

  object-fit: contain;

  background: #000;
}


/* =========================================================
   DASHBOARD
========================================================= */

#dashboard {
  width: 100%;
  height: 35vh;

  background: linear-gradient(
    135deg,
    #f8fbff,
    #eef4fb
  );

  color: #102642;

  padding: 1.2vh 2vw;

  overflow: hidden;
}


/* =========================================================
   DASHBOARD HEADER
========================================================= */

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;

  margin-bottom: 1vh;
}

.title {
  font-size: 1.7vw;
  font-weight: 800;
  letter-spacing: .02em;
}

.sub {
  font-size: .8vw;
  color: #5c6f85;
}


/* =========================================================
   DASHBOARD GRID
========================================================= */

.grid {
  display: grid;

  grid-template-columns: repeat(5, 1fr);

  gap: 1vw;
}


/* =========================================================
   CARDS
========================================================= */

.card {
  background: white;

  border-radius: .8vw;

  padding: .8vw .6vw;

  text-align: center;

  box-shadow:
    0 6px 16px rgba(18,45,75,.10);
}

.label {
  font-size: .8vw;
  font-weight: 700;

  min-height: 2.5em;

  display: flex;
  align-items: center;
  justify-content: center;
}

.value {
  font-size: 1.7vw;
  font-weight: 800;

  margin: .3vw 0;

  color: #159447;
}


/* =========================================================
   PROGRESS RING
========================================================= */

.ring {
  --p: 0;

  width: 4vw;
  height: 4vw;

  border-radius: 50%;

  margin: 0 auto .3vw;

  background:
    conic-gradient(
      #22b455 calc(var(--p) * 1%),
      #e4ebf1 0
    );

  position: relative;
}

.ring:after {
  content: "";

  position: absolute;

  inset: .55vw;

  border-radius: 50%;

  background: #fff;
}


/* =========================================================
   FOOTER
========================================================= */

.foot {
  margin-top: .8vh;

  display: flex;
  justify-content: space-between;
  align-items: center;

  color: #607489;

  font-size: .7vw;
}

.status {
  display: flex;
  align-items: center;

  gap: .4vw;
}

.dot {
  width: .45vw;
  height: .45vw;

  border-radius: 50%;

  background: #25b05b;
}

#error {
  color: #b42318;
}

</style>

</head>


<body>

<div class="stage">


  <!-- =====================================================
       VIDEO ADS
  ====================================================== -->

  <div id="videoArea">

    <video
      id="signageVideo"
      autoplay
      playsinline
      preload="auto">
    </video>

  </div>


  <!-- =====================================================
       SALES DASHBOARD
  ====================================================== -->

  <section id="dashboard">

    <div class="top">

      <div>

        <div class="title">
          SALES PROGRESS DASHBOARD
        </div>

        <div class="sub">
          Live percentages from Google Sheets
        </div>

      </div>

      <div class="sub">
        <img src="mechtest logo.png" alt="MechTest Logo">
      </div>

    </div>


    <div
      class="grid"
      id="cards">
    </div>


    <div class="foot">

      <div class="status">

        <span class="dot"></span>

        <span id="sync">
          Connecting to Google Sheets...
        </span>

      </div>


      <div id="clock"></div>

    </div>

  </section>


</div>


<script>


/* =========================================================
   GOOGLE SHEETS
========================================================= */

const CSV_URL =
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vSgYkO7VW6kAjGgYS8BfIprjsD8l82rbrkaBNUxzmHiNftLWBScM513EsZTy6lV7L9fpFA_nj9Zpfsl/pub?gid=738983995&single=true&output=csv";


const REFRESH_MS = 30000;


/* =========================================================
   DEFAULT DASHBOARD DATA
========================================================= */

const defaults = [

  ["Monthly Target", 60],

  ["Quarterly Target", 80],

  ["Annual Target", 60],

  ["Quarterly Bonus", 60],

  ["Annual Bonus", 80]

];


let data = defaults.slice();



/* =========================================================
   VIDEO PLAYLIST
========================================================= */

const signagePlaylist = [

  "https://github.com/marctanabc/Mechtest-Dashboard/releases/download/signage-v2/Ad1.mp4",

  "https://github.com/marctanabc/Mechtest-Dashboard/releases/download/signage-v2/Ad2.mp4",
  
  "https://github.com/marctanabc/Mechtest-Dashboard/releases/download/signage-v2/Ad3.mp4"

];


let currentVideoIndex = 0;


const signageVideo =
  document.getElementById("signageVideo");


/* =========================================================
   PLAY CURRENT AD
========================================================= */

function playCurrentAd() {

  const videoUrl =
    signagePlaylist[currentVideoIndex];

  console.log(
    "Playing Ad " + (currentVideoIndex + 1),
    videoUrl
  );


  signageVideo.pause();

  signageVideo.src =
    videoUrl;

  signageVideo.currentTime = 0;

  signageVideo.muted = false;

  signageVideo.volume = 1;

  signageVideo.load();


  const playPromise =
    signageVideo.play();


  if (
    playPromise !== undefined
  ) {

    playPromise.catch(error => {

      console.error(
        "Video autoplay with sound was blocked:",
        error
      );

      /*
        Chrome can block autoplay with sound.

        If blocked, wait for one click anywhere
        on the page, then start the playlist.
      */

      document.body.addEventListener(
        "click",
        startVideoAfterClick,
        {
          once: true
        }
      );

    });

  }

}


/* =========================================================
   START AFTER CLICK
========================================================= */

function startVideoAfterClick() {

  signageVideo.muted = false;

  signageVideo.volume = 1;

  signageVideo
    .play()
    .catch(error => {

      console.error(
        "Video playback failed after click:",
        error
      );

    });

}


/* =========================================================
   NEXT AD
========================================================= */

function playNextAd() {

  currentVideoIndex =
    (
      currentVideoIndex + 1
    ) %
    signagePlaylist.length;


  playCurrentAd();

}


/* =========================================================
   VIDEO ENDED
========================================================= */

signageVideo.addEventListener(
  "ended",
  function () {

    console.log(
      "Ad finished. Playing next ad."
    );

    playNextAd();

  }
);


/* =========================================================
   VIDEO ERROR
========================================================= */

signageVideo.addEventListener(
  "error",
  function () {

    console.error(
      "Unable to load video:",
      signagePlaylist[currentVideoIndex]
    );


    setTimeout(
      playNextAd,
      2000
    );

  }
);


/* =========================================================
   DASHBOARD RENDER
========================================================= */

function renderDashboard() {

  const cards =
    document.getElementById("cards");


  cards.innerHTML = "";


  data.forEach(
    ([label, pct]) => {

      pct =
        Math.max(
          0,
          Math.min(
            100,
            Number(pct) || 0
          )
        );


      const card =
        document.createElement("div");


      card.className =
        "card";


      card.innerHTML = `

        <div class="label">
          ${label}
        </div>

        <div class="value">
          ${pct}%
        </div>

        <div
          class="ring"
          style="--p:${pct}">
        </div>

        <div class="sub">
          Progress
        </div>

      `;


      cards.appendChild(
        card
      );

    }
  );

}


/* =========================================================
   CSV PARSER
========================================================= */

function parseCSVLine(line) {

  const values = [];

  let current = "";

  let quoted = false;


  for (
    let i = 0;
    i < line.length;
    i++
  ) {

    const char =
      line[i];


    if (
      char === '"'
    ) {

      if (
        quoted &&
        line[i + 1] === '"'
      ) {

        current += '"';

        i++;

      } else {

        quoted =
          !quoted;

      }

    } else if (
      char === "," &&
      !quoted
    ) {

      values.push(
        current
      );

      current = "";

    } else {

      current += char;

    }

  }


  values.push(
    current
  );


  return values;

}


/* =========================================================
   LOAD GOOGLE SHEET
========================================================= */

async function loadSheet() {

  const sync =
    document.getElementById("sync");


  try {

    sync.textContent =
      "Syncing Google Sheets...";


    const requestUrl =
      CSV_URL +
      "&_=" +
      Date.now();


    const response =
      await fetch(
        requestUrl,
        {
          method: "GET",
          cache: "no-store"
        }
      );


    if (
      !response.ok
    ) {

      throw new Error(
        "HTTP " +
        response.status
      );

    }


    const csvText =
      await response.text();


    const rows =
      csvText

        .replace(
          /^\uFEFF/,
          ""
        )

        .split(
          /\r?\n/
        )

        .filter(Boolean)

        .map(
          parseCSVLine
        );


    const expected =
      new Map(

        defaults.map(
          ([name]) => [
            name.toLowerCase(),
            name
          ]
        )

      );


    const newData = [];


    for (
      const row of rows
    ) {

      if (
        row.length < 2
      ) {

        continue;

      }


      const label =
        String(
          row[0] || ""
        )
        .trim();


      const key =
        label.toLowerCase();


      if (
        !expected.has(key)
      ) {

        continue;

      }


      let raw =
        String(
          row[1] || ""
        )

        .trim()

        .replace(
          "%",
          ""
        )

        .trim();


      let value =
        parseFloat(raw);


      if (
        Number.isNaN(value)
      ) {

        continue;

      }


      if (
        value > 0 &&
        value <= 1
      ) {

        value =
          value * 100;

      }


      value =
        Math.round(
          value * 100
        ) / 100;


      newData.push(
        [
          expected.get(key),
          value
        ]
      );

    }


    if (
      newData.length !== 5
    ) {

      throw new Error(
        "Expected 5 metrics, found " +
        newData.length
      );

    }


    data =
      newData;


    renderDashboard();


    sync.textContent =
      "Synced " +
      new Date()
        .toLocaleTimeString();


  } catch (error) {

    console.error(
      "Google Sheets sync error:",
      error
    );


    sync.innerHTML =
      '<span id="error">' +
      'Sheet sync error: ' +
      String(
        error.message ||
        error
      ) +
      '</span>';

  }

}


/* =========================================================
   CLOCK
========================================================= */

function updateClock() {

  document
    .getElementById("clock")
    .textContent =
      new Date()
        .toLocaleString();

}


setInterval(
  updateClock,
  1000
);


/* =========================================================
   START SIGNAGE
========================================================= */

renderDashboard();

loadSheet();

setInterval(
  loadSheet,
  REFRESH_MS
);

updateClock();

playCurrentAd();


</script>

</body>
</html>
