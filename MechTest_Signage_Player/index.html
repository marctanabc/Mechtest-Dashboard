<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1">

<title>MechTest Digital Signage</title>


<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  font-family: Arial, Helvetica, sans-serif;
  overflow: hidden;
  background: #07121f;
}


/* =========================================================
   MAIN SIGNAGE LAYOUT
========================================================= */

.stage {
  width: 100vw;
  height: 100vh;

  display: flex;
  flex-direction: column;

  background: #07121f;
}


/* =========================================================
   VIDEO AREA
========================================================= */

#videoArea {
  width: 100%;
  height: 65vh;

  background: #000;

  display: flex;
  align-items: center;
  justify-content: center;

  overflow: hidden;
}

#signageVideo {
  width: 100%;
  height: 100%;

  object-fit: contain;

  background: #000;
}


/* =========================================================
   DASHBOARD
========================================================= */

#dashboard {
  width: 100%;
  height: 35vh;

  background:
    linear-gradient(
      135deg,
      #f8fbff,
      #eef4fb
    );

  color: #102642;

  padding: 1.2vh 2vw;

  overflow: hidden;
}


/* =========================================================
   DASHBOARD HEADER
========================================================= */

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;

  margin-bottom: 1vh;
}

.title {
  font-size: 1.7vw;
  font-weight: 800;
  letter-spacing: .02em;
}

.sub {
  font-size: .8vw;
  color: #5c6f85;
}


/* =========================================================
   MECHTEST LOGO
========================================================= */

.logo-wrap {
  display: flex;
  align-items: center;
  justify-content: flex-end;
}

.logo-wrap img {
  height: 4.5vh;
  width: auto;
  max-width: 14vw;

  object-fit: contain;

  display: block;
}


/* =========================================================
   DASHBOARD GRID
========================================================= */

.grid {
  display: grid;

  grid-template-columns:
    repeat(5, 1fr);

  gap: 1vw;
}


/* =========================================================
   CARDS
========================================================= */

.card {
  background: white;

  border-radius: .8vw;

  padding: .65vw .55vw;

  text-align: center;

  box-shadow:
    0 6px 16px
    rgba(18,45,75,.10);
}

.label {
  font-size: .8vw;
  font-weight: 700;

  min-height: 2.2em;

  display: flex;
  align-items: center;
  justify-content: center;
}

.value {
  font-size: 1.55vw;
  font-weight: 800;

  margin:
    .15vw 0
    .2vw;

  color: #159447;
}


/* =========================================================
   NORMAL SINGLE RING
========================================================= */

.ring {
  --p: 0;

  width: 4vw;
  height: 4vw;

  border-radius: 50%;

  margin:
    0 auto .3vw;

  background:
    conic-gradient(
      #22b455
      calc(var(--p) * 1%),

      #e4ebf1 0
    );

  position: relative;
}

.ring:after {
  content: "";

  position: absolute;

  inset: .55vw;

  border-radius: 50%;

  background: #fff;
}


/* =========================================================
   DOUBLE RING

   OUTER = INVOICING PROGRESS
   INNER = TIME ELAPSED
========================================================= */

.double-ring {
  position: relative;

  width: 5.2vw;
  height: 5.2vw;

  margin:
    .1vw auto
    .15vw;
}


/* =========================================================
   OUTER INVOICE RING
========================================================= */

.invoice-ring {
  --invoice: 0;

  position: absolute;

  inset: 0;

  border-radius: 50%;

  background:
    conic-gradient(
      #22b455
      calc(var(--invoice) * 1%),

      #e5eaf0 0
    );

  z-index: 1;
}

.invoice-ring:after {
  content: "";

  position: absolute;

  inset: .42vw;

  border-radius: 50%;

  background: #fff;
}


/* =========================================================
   INNER TIME RING
========================================================= */

.time-ring {
  --time: 0;

  position: absolute;

  inset: .82vw;

  border-radius: 50%;

  background:
    conic-gradient(
      #7393b3
      calc(var(--time) * 1%),

      #e5eaf0 0
    );

  z-index: 2;
}

.time-ring:after {
  content: "";

  position: absolute;

  inset: .42vw;

  border-radius: 50%;

  background: #fff;
}


/* =========================================================
   CENTRE VALUE = TIME ELAPSED
========================================================= */

.ring-center {
  position: absolute;

  inset: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  z-index: 5;

  font-size: .72vw;
  font-weight: 800;

  color: #7393b3;
}


/* =========================================================
   DOUBLE RING LEGEND
========================================================= */

.ring-legend {
  margin-top: .1vw;

  display: flex;
  justify-content: center;
  align-items: center;

  gap: .55vw;

  font-size: .57vw;

  color: #607489;
}

.legend-item {
  display: flex;
  align-items: center;

  gap: .18vw;
}

.legend-dot {
  width: .42vw;
  height: .42vw;

  border-radius: 50%;
}

.legend-time {
  background: #7393b3;
}

.legend-progress {
  background: #22b455;
}


/* =========================================================
   AHEAD / BEHIND
========================================================= */

.schedule-status {
  margin-top: .18vw;

  font-size: .66vw;
  font-weight: 800;
}

.schedule-status.ahead {
  color: #159447;
}

.schedule-status.behind {
  color: #c62828;
}

.schedule-status.ontrack {
  color: #607489;
}


/* =========================================================
   FOOTER
========================================================= */

.foot {
  margin-top: .6vh;

  display: flex;
  justify-content: space-between;
  align-items: center;

  color: #607489;

  font-size: .7vw;
}

.status {
  display: flex;
  align-items: center;

  gap: .4vw;
}

.dot {
  width: .45vw;
  height: .45vw;

  border-radius: 50%;

  background: #25b05b;
}

#error {
  color: #b42318;
}

</style>

</head>


<body>


<div class="stage">


  <!-- =====================================================
       VIDEO ADS
  ====================================================== -->

  <div id="videoArea">

    <video
      id="signageVideo"
      autoplay
      playsinline
      preload="auto">
    </video>

  </div>


  <!-- =====================================================
       SALES DASHBOARD
  ====================================================== -->

  <section id="dashboard">


    <div class="top">


      <div>

        <div class="title">
          SALES PROGRESS DASHBOARD
        </div>

        <div class="sub">
          Live percentages from current fiscal year 2026-2027
        </div>

      </div>


      <div class="logo-wrap">

        <img
          src="./mechtest-logo.PNG"
          alt="MechTest Logo">

      </div>


    </div>


    <div
      class="grid"
      id="cards">
    </div>


    <div class="foot">


      <div class="status">

        <span class="dot"></span>

        <span id="sync">
          Connecting to Google Sheets...
        </span>

      </div>


      <div id="clock"></div>


    </div>


  </section>


</div>



<script>


/* =========================================================
   GOOGLE APPS SCRIPT API
========================================================= */

const API_URL =
  "https://script.google.com/macros/s/AKfycbwVIlg1d8rbSFxSZ4xW25DuSh9Nxww7jGrVzEw775SIr81n8M8dv7kk0thkkEKHpOnI/exec";


/*
  Dashboard requests current data
  every 10 seconds.
*/

const REFRESH_MS =
  10000;


/*
  Last valid API data is kept locally.

  If internet/API temporarily fails,
  the workshop still sees the most
  recently received valid figures.
*/

const STORAGE_KEY =
  "mechtestDashboardApiData";


/* =========================================================
   EXPECTED DASHBOARD METRICS
========================================================= */

const defaults = [

  ["Monthly Target", 100],

  ["Quarterly Target", 100],

  ["Annual Target", 100],

  ["Quarterly Bonus", 100],

  ["Annual Bonus", 100]

];


let data =
  defaults.slice();


/* =========================================================
   LAST API STATE
========================================================= */

let currentSignature =
  "";

let lastApiGeneratedAt =
  "";


/* =========================================================
   VIDEO PLAYLIST
========================================================= */

const signagePlaylist = [

  "https://github.com/marctanabc/Mechtest-Dashboard/releases/download/signage-v2/Ad1.mp4",

  "https://github.com/marctanabc/Mechtest-Dashboard/releases/download/signage-v2/Ad2.mp4",

  "https://github.com/marctanabc/Mechtest-Dashboard/releases/download/signage-v2/Ad3.mp4"

];


let currentVideoIndex =
  0;


const signageVideo =
  document.getElementById(
    "signageVideo"
  );


/* =========================================================
   PLAY CURRENT AD
========================================================= */

function playCurrentAd() {

  const videoUrl =
    signagePlaylist[
      currentVideoIndex
    ];


  console.log(
    "Playing Ad " +
    (currentVideoIndex + 1),

    videoUrl
  );


  signageVideo.pause();


  signageVideo.src =
    videoUrl;


  signageVideo.currentTime =
    0;


  signageVideo.muted =
    false;


  signageVideo.volume =
    1;


  signageVideo.load();


  const playPromise =
    signageVideo.play();


  if (
    playPromise !== undefined
  ) {

    playPromise.catch(
      error => {

        console.error(
          "Video autoplay with sound was blocked:",
          error
        );


        document.body.addEventListener(
          "click",
          startVideoAfterClick,
          {
            once: true
          }
        );

      }
    );

  }

}


/* =========================================================
   START VIDEO AFTER CLICK
========================================================= */

function startVideoAfterClick() {

  signageVideo.muted =
    false;


  signageVideo.volume =
    1;


  signageVideo
    .play()
    .catch(
      error => {

        console.error(
          "Video playback failed after click:",
          error
        );

      }
    );

}


/* =========================================================
   NEXT VIDEO
========================================================= */

function playNextAd() {

  currentVideoIndex =
    (
      currentVideoIndex + 1
    ) %
    signagePlaylist.length;


  playCurrentAd();

}


/* =========================================================
   VIDEO EVENTS
========================================================= */

signageVideo.addEventListener(
  "ended",
  function () {

    playNextAd();

  }
);


signageVideo.addEventListener(
  "error",
  function () {

    console.error(
      "Unable to load video:",
      signagePlaylist[
        currentVideoIndex
      ]
    );


    setTimeout(
      playNextAd,
      2000
    );

  }
);


/* =========================================================
   PERCENTAGE HELPER
========================================================= */

function clampPercent(
  value
) {

  return Math.max(
    0,
    Math.min(
      100,
      Number(value) || 0
    )
  );

}


/* =========================================================
   MONTHLY TIME ELAPSED
========================================================= */

function getMonthElapsedPercent() {

  const now =
    new Date();


  const start =
    new Date(

      now.getFullYear(),

      now.getMonth(),

      1,

      0,
      0,
      0,
      0

    );


  const end =
    new Date(

      now.getFullYear(),

      now.getMonth() + 1,

      1,

      0,
      0,
      0,
      0

    );


  return clampPercent(

    (
      (now - start) /
      (end - start)
    ) *

    100

  );

}


/* =========================================================
   FISCAL QUARTER TIME ELAPSED

   MechTest Fiscal Year:
   July 1 -> June 30

   Q1 = Jul - Sep
   Q2 = Oct - Dec
   Q3 = Jan - Mar
   Q4 = Apr - Jun
========================================================= */

function getQuarterElapsedPercent() {

  const now =
    new Date();


  const year =
    now.getFullYear();


  const month =
    now.getMonth();


  let quarterStartMonth;

  let quarterStartYear;


  if (
    month >= 6 &&
    month <= 8
  ) {

    quarterStartMonth =
      6;

    quarterStartYear =
      year;

  }


  else if (
    month >= 9 &&
    month <= 11
  ) {

    quarterStartMonth =
      9;

    quarterStartYear =
      year;

  }


  else if (
    month >= 0 &&
    month <= 2
  ) {

    quarterStartMonth =
      0;

    quarterStartYear =
      year;

  }


  else {

    quarterStartMonth =
      3;

    quarterStartYear =
      year;

  }


  const start =
    new Date(

      quarterStartYear,

      quarterStartMonth,

      1,

      0,
      0,
      0,
      0

    );


  const end =
    new Date(

      quarterStartYear,

      quarterStartMonth + 3,

      1,

      0,
      0,
      0,
      0

    );


  return clampPercent(

    (
      (now - start) /
      (end - start)
    ) *

    100

  );

}


/* =========================================================
   FISCAL YEAR TIME ELAPSED

   JULY 1 -> JUNE 30
========================================================= */

function getFiscalYearElapsedPercent() {

  const now =
    new Date();


  const year =
    now.getFullYear();


  const month =
    now.getMonth();


  let fiscalStartYear;


  if (
    month >= 6
  ) {

    fiscalStartYear =
      year;

  }

  else {

    fiscalStartYear =
      year - 1;

  }


  const start =
    new Date(

      fiscalStartYear,

      6,

      1,

      0,
      0,
      0,
      0

    );


  const end =
    new Date(

      fiscalStartYear + 1,

      6,

      1,

      0,
      0,
      0,
      0

    );


  return clampPercent(

    (
      (now - start) /
      (end - start)
    ) *

    100

  );

}


/* =========================================================
   GET TIME ELAPSED
========================================================= */

function getTimeElapsedPercent(
  label
) {

  switch (
    label
  ) {

    case "Monthly Target":

      return getMonthElapsedPercent();


    case "Quarterly Target":

      return getQuarterElapsedPercent();


    case "Annual Target":

      return getFiscalYearElapsedPercent();


    default:

      return null;

  }

}


/* =========================================================
   DOUBLE RING CARDS
========================================================= */

function usesDoubleRing(
  label
) {

  return (

    label ===
      "Monthly Target" ||

    label ===
      "Quarterly Target" ||

    label ===
      "Annual Target"

  );

}


/* =========================================================
   AHEAD / BEHIND
========================================================= */

function getScheduleStatus(
  progressPercent,
  timePercent
) {

  const difference =
    progressPercent -
    timePercent;


  if (
    difference > 1
  ) {

    return {

      className:
        "ahead",

      text:
        "Ahead by " +
        difference.toFixed(1) +
        "%"

    };

  }


  if (
    difference < -1
  ) {

    return {

      className:
        "behind",

      text:
        "Behind by " +
        Math.abs(
          difference
        ).toFixed(1) +
        "%"

    };

  }


  return {

    className:
      "ontrack",

    text:
      "On track"

  };

}


/* =========================================================
   DASHBOARD RENDER
========================================================= */

function renderDashboard() {

  const cards =
    document.getElementById(
      "cards"
    );


  cards.innerHTML =
    "";


  data.forEach(
    ([label, pct]) => {


      pct =
        clampPercent(
          pct
        );


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "card";


      if (
        usesDoubleRing(
          label
        )
      ) {


        const timePercent =
          clampPercent(
            getTimeElapsedPercent(
              label
            )
          );


        const schedule =
          getScheduleStatus(
            pct,
            timePercent
          );


        card.innerHTML = `

          <div class="label">
            ${label}
          </div>


          <div class="value">
            ${pct.toFixed(1)}%
          </div>


          <div class="double-ring">


            <div
              class="invoice-ring"
              style="--invoice:${pct}">
            </div>


            <div
              class="time-ring"
              style="--time:${timePercent}">
            </div>


            <div class="ring-center">
              ${timePercent.toFixed(0)}%
            </div>


          </div>


          <div class="ring-legend">


            <div class="legend-item">

              <span
                class="legend-dot legend-time">
              </span>

              Time ${timePercent.toFixed(0)}%

            </div>


            <div class="legend-item">

              <span
                class="legend-dot legend-progress">
              </span>

              Invoice ${pct.toFixed(0)}%

            </div>


          </div>


          <div
            class="schedule-status ${schedule.className}">

            ${schedule.text}

          </div>

        `;

      }


      else {

        card.innerHTML = `

          <div class="label">
            ${label}
          </div>


          <div class="value">
            ${pct.toFixed(1)}%
          </div>


          <div
            class="ring"
            style="--p:${pct}">
          </div>


          <div class="sub">
            Progress
          </div>

        `;

      }


      cards.appendChild(
        card
      );

    }
  );

}


/* =========================================================
   DATA SIGNATURE
========================================================= */

function createDataSignature(
  dataset
) {

  return JSON.stringify(
    dataset
  );

}


/* =========================================================
   SAVE LAST VALID API DATA LOCALLY
========================================================= */

function saveCurrentData(
  dataset,
  generatedAt
) {

  try {

    localStorage.setItem(

      STORAGE_KEY,

      JSON.stringify(
        {

          data:
            dataset,

          generatedAt:
            generatedAt || "",

          savedAt:
            Date.now()

        }
      )

    );

  }


  catch (
    error
  ) {

    console.warn(
      "Unable to save dashboard data:",
      error
    );

  }

}


/* =========================================================
   RESTORE LAST VALID DATA
========================================================= */

function restoreCurrentData() {

  try {

    const saved =
      localStorage.getItem(
        STORAGE_KEY
      );


    if (
      !saved
    ) {

      return;

    }


    const parsed =
      JSON.parse(
        saved
      );


    if (
      !parsed ||

      !Array.isArray(
        parsed.data
      ) ||

      parsed.data.length !== 5
    ) {

      return;

    }


    data =
      parsed.data;


    currentSignature =
      createDataSignature(
        data
      );


    lastApiGeneratedAt =
      parsed.generatedAt || "";


    console.log(
      "Restored last valid API dashboard data."
    );

  }


  catch (
    error
  ) {

    console.warn(
      "Unable to restore dashboard values:",
      error
    );

  }

}


/* =========================================================
   APPLY API DATA
========================================================= */

function applyData(
  newData,
  generatedAt
) {

  const newSignature =
    createDataSignature(
      newData
    );


  data =
    newData;


  currentSignature =
    newSignature;


  lastApiGeneratedAt =
    generatedAt || "";


  saveCurrentData(
    newData,
    generatedAt
  );


  renderDashboard();

}


/* =========================================================
   FETCH LIVE DATA FROM APPS SCRIPT
========================================================= */

async function fetchSheetData() {

  /*
    Unique query value prevents the browser
    from reusing the same request URL.
  */

  const requestUrl =

    API_URL +

    "?_ts=" +

    Date.now();


  const response =
    await fetch(
      requestUrl,
      {

        method:
          "GET",

        cache:
          "no-store"

      }
    );


  if (
    !response.ok
  ) {

    throw new Error(
      "API HTTP " +
      response.status
    );

  }


  const result =
    await response.json();


  if (
    !result ||
    result.ok !== true
  ) {

    throw new Error(

      result &&
      result.error

        ? result.error

        : "Apps Script API returned an invalid response"

    );

  }


  if (
    !result.metrics ||
    typeof result.metrics !== "object"
  ) {

    throw new Error(
      "Apps Script API response has no metrics object"
    );

  }


  const newData =
    [];


  for (
    const [name] of defaults
  ) {


    if (
      !Object.prototype.hasOwnProperty.call(
        result.metrics,
        name
      )
    ) {

      throw new Error(
        "Missing API metric: " +
        name
      );

    }


    const value =
      Number(
        result.metrics[
          name
        ]
      );


    if (
      !Number.isFinite(
        value
      )
    ) {

      throw new Error(
        "Invalid API value for " +
        name
      );

    }


    newData.push(
      [

        name,

        clampPercent(
          value
        )

      ]
    );

  }


  return {

    data:
      newData,

    generatedAt:
      result.generatedAt || ""

  };

}


/* =========================================================
   LOAD GOOGLE SHEET THROUGH API
========================================================= */

async function loadSheet() {

  const sync =
    document.getElementById(
      "sync"
    );


  try {

    const apiResult =
      await fetchSheetData();


    const newData =
      apiResult.data;


    const newSignature =
      createDataSignature(
        newData
      );


    /*
      Only redraw when values actually changed.
    */

    if (
      newSignature !==
      currentSignature
    ) {

      applyData(
        newData,
        apiResult.generatedAt
      );


      sync.textContent =
        "Updated " +
        new Date()
          .toLocaleTimeString();

    }


    else {

      lastApiGeneratedAt =
        apiResult.generatedAt || "";


      sync.textContent =
        "Live sync " +
        new Date()
          .toLocaleTimeString();

    }

  }


  catch (
    error
  ) {

    console.error(
      "Apps Script API sync error:",
      error
    );


    /*
      If the API or internet temporarily fails,
      keep the last valid figures on screen.
    */

    sync.innerHTML =

      '<span id="error">' +

      'API sync unavailable - showing last known data' +

      '</span>';

  }

}


/* =========================================================
   CLOCK
========================================================= */

function updateClock() {

  document
    .getElementById(
      "clock"
    )
    .textContent =

      new Date()
        .toLocaleString();

}


setInterval(
  updateClock,
  1000
);


/* =========================================================
   START SIGNAGE
========================================================= */

/*
  Restore last valid figures immediately
  after browser/PC restart.
*/

restoreCurrentData();


renderDashboard();


/*
  Fetch live API immediately.
*/

loadSheet();


/*
  Then check Apps Script every 10 seconds.
*/

setInterval(
  loadSheet,
  REFRESH_MS
);


updateClock();


playCurrentAd();


</script>

</body>

</html>
