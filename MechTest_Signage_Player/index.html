<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>MechTest Digital Signage</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  font-family: Arial, Helvetica, sans-serif;
  overflow: hidden;
  background: #07121f;
}


/* =========================================================
   MAIN SIGNAGE LAYOUT
========================================================= */

.stage {
  width: 100vw;
  height: 100vh;

  display: flex;
  flex-direction: column;

  background: #07121f;
}


/* =========================================================
   VIDEO AREA
========================================================= */

#videoArea {
  width: 100%;
  height: 65vh;

  background: #000;

  display: flex;
  align-items: center;
  justify-content: center;

  overflow: hidden;
}

#signageVideo {
  width: 100%;
  height: 100%;

  object-fit: contain;

  background: #000;
}


/* =========================================================
   DASHBOARD
========================================================= */

#dashboard {
  width: 100%;
  height: 35vh;

  background: linear-gradient(
    135deg,
    #f8fbff,
    #eef4fb
  );

  color: #102642;

  padding: 1.2vh 2vw;

  overflow: hidden;
}


/* =========================================================
   DASHBOARD HEADER
========================================================= */

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;

  margin-bottom: 1vh;
}

.title {
  font-size: 1.7vw;
  font-weight: 800;
  letter-spacing: .02em;
}

.sub {
  font-size: .8vw;
  color: #5c6f85;
}


/* =========================================================
   MECHTEST LOGO
========================================================= */

.logo-wrap {
  display: flex;
  align-items: center;
  justify-content: flex-end;
}

.logo-wrap img {
  height: 4.5vh;
  width: auto;
  max-width: 14vw;
  object-fit: contain;
  display: block;
}


/* =========================================================
   DASHBOARD GRID
========================================================= */

.grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 1vw;
}


/* =========================================================
   CARDS
========================================================= */

.card {
  background: white;

  border-radius: .8vw;

  padding: .65vw .55vw;

  text-align: center;

  box-shadow:
    0 6px 16px rgba(18,45,75,.10);
}

.label {
  font-size: .8vw;
  font-weight: 700;

  min-height: 2.2em;

  display: flex;
  align-items: center;
  justify-content: center;
}

.value {
  font-size: 1.55vw;
  font-weight: 800;

  margin: .15vw 0 .2vw;

  color: #159447;
}


/* =========================================================
   NORMAL SINGLE RING
========================================================= */

.ring {
  --p: 0;

  width: 4vw;
  height: 4vw;

  border-radius: 50%;

  margin: 0 auto .3vw;

  background:
    conic-gradient(
      #22b455 calc(var(--p) * 1%),
      #e4ebf1 0
    );

  position: relative;
}

.ring:after {
  content: "";

  position: absolute;

  inset: .55vw;

  border-radius: 50%;

  background: #fff;
}


/* =========================================================
   DOUBLE RING

   OUTER = TIME ELAPSED
   INNER = INVOICING PROGRESS
========================================================= */

.double-ring {
  position: relative;

  width: 5.2vw;
  height: 5.2vw;

  margin: .1vw auto .15vw;
}


/* OUTER TIME RING */

.time-ring {
  --time: 0;

  position: absolute;

  inset: 0;

  border-radius: 50%;

  background:
    conic-gradient(
      #7393b3 calc(var(--time) * 1%),
      #e5eaf0 0
    );
}

.time-ring:after {
  content: "";

  position: absolute;

  inset: .42vw;

  border-radius: 50%;

  background: #fff;
}


/* INNER INVOICING RING */

.invoice-ring {
  --invoice: 0;

  position: absolute;

  inset: .82vw;

  border-radius: 50%;

  background:
    conic-gradient(
      #22b455 calc(var(--invoice) * 1%),
      #e5eaf0 0
    );

  z-index: 2;
}

.invoice-ring:after {
  content: "";

  position: absolute;

  inset: .42vw;

  border-radius: 50%;

  background: #fff;
}


/* NUMBER IN CENTRE */

.ring-center {
  position: absolute;

  inset: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  z-index: 5;

  font-size: .72vw;
  font-weight: 800;

  color: #159447;
}


/* =========================================================
   DOUBLE RING LEGEND
========================================================= */

.ring-legend {
  margin-top: .1vw;

  display: flex;
  justify-content: center;
  align-items: center;

  gap: .55vw;

  font-size: .57vw;

  color: #607489;
}

.legend-item {
  display: flex;
  align-items: center;

  gap: .18vw;
}

.legend-dot {
  width: .42vw;
  height: .42vw;

  border-radius: 50%;
}

.legend-time {
  background: #7393b3;
}

.legend-progress {
  background: #22b455;
}


/* =========================================================
   AHEAD / BEHIND
========================================================= */

.schedule-status {
  margin-top: .18vw;

  font-size: .66vw;
  font-weight: 800;
}

.schedule-status.ahead {
  color: #159447;
}

.schedule-status.behind {
  color: #c62828;
}

.schedule-status.ontrack {
  color: #607489;
}


/* =========================================================
   FOOTER
========================================================= */

.foot {
  margin-top: .6vh;

  display: flex;
  justify-content: space-between;
  align-items: center;

  color: #607489;

  font-size: .7vw;
}

.status {
  display: flex;
  align-items: center;

  gap: .4vw;
}

.dot {
  width: .45vw;
  height: .45vw;

  border-radius: 50%;

  background: #25b05b;
}

#error {
  color: #b42318;
}

</style>

</head>


<body>

<div class="stage">


  <!-- =====================================================
       VIDEO ADS
  ====================================================== -->

  <div id="videoArea">

    <video
      id="signageVideo"
      autoplay
      playsinline
      preload="auto">
    </video>

  </div>


  <!-- =====================================================
       SALES DASHBOARD
  ====================================================== -->

  <section id="dashboard">

    <div class="top">

      <div>

        <div class="title">
          SALES PROGRESS DASHBOARD
        </div>

        <div class="sub">
          Live percentages from Google Sheets
        </div>

      </div>


      <div class="logo-wrap">

    <img
    src="./mechtest-logo.PNG"
    alt="MechTest Logo">

    </div>

    </div>


    <div
      class="grid"
      id="cards">
    </div>


    <div class="foot">

      <div class="status">

        <span class="dot"></span>

        <span id="sync">
          Connecting to Google Sheets...
        </span>

      </div>


      <div id="clock"></div>

    </div>

  </section>


</div>


<script>


/* =========================================================
   GOOGLE SHEETS
========================================================= */

const CSV_URL =
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vSgYkO7VW6kAjGgYS8BfIprjsD8l82rbrkaBNUxzmHiNftLWBScM513EsZTy6lV7L9fpFA_nj9Zpfsl/pub?gid=738983995&single=true&output=csv";


/*
  Refresh Google Sheets every 10 seconds.
*/

const REFRESH_MS = 10000;


/* =========================================================
   DEFAULT DASHBOARD DATA
========================================================= */

const defaults = [

  ["Monthly Target", 100],

  ["Quarterly Target", 100],

  ["Annual Target", 100],

  ["Quarterly Bonus", 100],

  ["Annual Bonus", 100]

];


let data = defaults.slice();



/* =========================================================
   VIDEO PLAYLIST
========================================================= */

const signagePlaylist = [

  "https://github.com/marctanabc/Mechtest-Dashboard/releases/download/signage-v2/Ad1.mp4",

  "https://github.com/marctanabc/Mechtest-Dashboard/releases/download/signage-v2/Ad2.mp4",

  "https://github.com/marctanabc/Mechtest-Dashboard/releases/download/signage-v2/Ad3.mp4"

];


let currentVideoIndex = 0;


const signageVideo =
  document.getElementById("signageVideo");


/* =========================================================
   PLAY CURRENT AD
========================================================= */

function playCurrentAd() {

  const videoUrl =
    signagePlaylist[currentVideoIndex];


  console.log(
    "Playing Ad " +
    (currentVideoIndex + 1),
    videoUrl
  );


  signageVideo.pause();


  signageVideo.src =
    videoUrl;


  signageVideo.currentTime = 0;


  signageVideo.muted = false;


  signageVideo.volume = 1;


  signageVideo.load();


  const playPromise =
    signageVideo.play();


  if (
    playPromise !== undefined
  ) {

    playPromise.catch(error => {

      console.error(
        "Video autoplay with sound was blocked:",
        error
      );


      document.body.addEventListener(
        "click",
        startVideoAfterClick,
        {
          once: true
        }
      );

    });

  }

}


/* =========================================================
   START VIDEO AFTER CLICK
========================================================= */

function startVideoAfterClick() {

  signageVideo.muted = false;

  signageVideo.volume = 1;


  signageVideo
    .play()
    .catch(error => {

      console.error(
        "Video playback failed after click:",
        error
      );

    });

}


/* =========================================================
   NEXT VIDEO
========================================================= */

function playNextAd() {

  currentVideoIndex =
    (
      currentVideoIndex + 1
    ) %
    signagePlaylist.length;


  playCurrentAd();

}


/* =========================================================
   VIDEO ENDED
========================================================= */

signageVideo.addEventListener(
  "ended",
  function () {

    playNextAd();

  }
);


/* =========================================================
   VIDEO ERROR
========================================================= */

signageVideo.addEventListener(
  "error",
  function () {

    console.error(
      "Unable to load video:",
      signagePlaylist[currentVideoIndex]
    );


    setTimeout(
      playNextAd,
      2000
    );

  }
);



/* =========================================================
   PERCENTAGE HELPER
========================================================= */

function clampPercent(value) {

  return Math.max(
    0,
    Math.min(
      100,
      Number(value) || 0
    )
  );

}



/* =========================================================
   MONTHLY TIME ELAPSED
========================================================= */

function getMonthElapsedPercent() {

  const now =
    new Date();


  const start =
    new Date(
      now.getFullYear(),
      now.getMonth(),
      1,
      0,
      0,
      0,
      0
    );


  const end =
    new Date(
      now.getFullYear(),
      now.getMonth() + 1,
      1,
      0,
      0,
      0,
      0
    );


  const elapsed =
    now - start;


  const total =
    end - start;


  return clampPercent(
    (elapsed / total) * 100
  );

}



/* =========================================================
   FISCAL QUARTER TIME ELAPSED

   MECHTEST:
   Q1 = JUL - SEP
   Q2 = OCT - DEC
   Q3 = JAN - MAR
   Q4 = APR - JUN
========================================================= */

function getQuarterElapsedPercent() {

  const now =
    new Date();


  const year =
    now.getFullYear();


  const month =
    now.getMonth();


  let quarterStartMonth;
  let quarterStartYear;


  /*
    JavaScript months:

    Jan = 0
    Apr = 3
    Jul = 6
    Oct = 9
  */


  if (
    month >= 6 &&
    month <= 8
  ) {

    /* Q1 */

    quarterStartMonth = 6;

    quarterStartYear = year;

  }

  else if (
    month >= 9 &&
    month <= 11
  ) {

    /* Q2 */

    quarterStartMonth = 9;

    quarterStartYear = year;

  }

  else if (
    month >= 0 &&
    month <= 2
  ) {

    /* Q3 */

    quarterStartMonth = 0;

    quarterStartYear = year;

  }

  else {

    /* Q4 */

    quarterStartMonth = 3;

    quarterStartYear = year;

  }


  const start =
    new Date(
      quarterStartYear,
      quarterStartMonth,
      1,
      0,
      0,
      0,
      0
    );


  const end =
    new Date(
      quarterStartYear,
      quarterStartMonth + 3,
      1,
      0,
      0,
      0,
      0
    );


  const elapsed =
    now - start;


  const total =
    end - start;


  return clampPercent(
    (elapsed / total) * 100
  );

}



/* =========================================================
   FISCAL YEAR TIME ELAPSED

   MECHTEST FINANCIAL YEAR:
   JULY 1 → JUNE 30
========================================================= */

function getFiscalYearElapsedPercent() {

  const now =
    new Date();


  const year =
    now.getFullYear();


  const month =
    now.getMonth();


  let fiscalStartYear;


  /*
    July onwards:
    FY started this calendar year.

    January - June:
    FY started previous calendar year.
  */


  if (
    month >= 6
  ) {

    fiscalStartYear =
      year;

  }

  else {

    fiscalStartYear =
      year - 1;

  }


  const start =
    new Date(
      fiscalStartYear,
      6,
      1,
      0,
      0,
      0,
      0
    );


  const end =
    new Date(
      fiscalStartYear + 1,
      6,
      1,
      0,
      0,
      0,
      0
    );


  const elapsed =
    now - start;


  const total =
    end - start;


  return clampPercent(
    (elapsed / total) * 100
  );

}



/* =========================================================
   GET TIME ELAPSED FOR TARGET
========================================================= */

function getTimeElapsedPercent(label) {

  switch (label) {

    case "Monthly Target":

      return getMonthElapsedPercent();


    case "Quarterly Target":

      return getQuarterElapsedPercent();


    case "Annual Target":

      return getFiscalYearElapsedPercent();


    default:

      return null;

  }

}



/* =========================================================
   DETERMINE DOUBLE RING CARDS
========================================================= */

function usesDoubleRing(label) {

  return (

    label === "Monthly Target" ||

    label === "Quarterly Target" ||

    label === "Annual Target"

  );

}



/* =========================================================
   AHEAD / BEHIND STATUS
========================================================= */

function getScheduleStatus(
  progressPercent,
  timePercent
) {

  const difference =
    progressPercent -
    timePercent;


  if (
    difference > 1
  ) {

    return {

      className: "ahead",

      text:
        "Ahead by " +
        difference.toFixed(1) +
        "%"

    };

  }


  if (
    difference < -1
  ) {

    return {

      className: "behind",

      text:
        "Behind by " +
        Math.abs(
          difference
        ).toFixed(1) +
        "%"

    };

  }


  return {

    className: "ontrack",

    text: "On track"

  };

}



/* =========================================================
   DASHBOARD RENDER
========================================================= */

function renderDashboard() {

  const cards =
    document.getElementById(
      "cards"
    );


  cards.innerHTML = "";


  data.forEach(
    ([label, pct]) => {


      pct =
        clampPercent(
          pct
        );


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "card";


      /* ===================================================
         TARGET CARDS WITH DOUBLE RINGS
      =================================================== */

      if (
        usesDoubleRing(label)
      ) {


        const timePercent =
          clampPercent(
            getTimeElapsedPercent(
              label
            )
          );


        const schedule =
          getScheduleStatus(
            pct,
            timePercent
          );


        card.innerHTML = `

          <div class="label">

            ${label}

          </div>


          <div class="value">

            ${pct.toFixed(1)}%

          </div>


          <div class="double-ring">


            <div
              class="time-ring"
              style="--time:${timePercent}">
            </div>


            <div
              class="invoice-ring"
              style="--invoice:${pct}">
            </div>


            <div class="ring-center">

              ${pct.toFixed(0)}%

            </div>


          </div>


          <div class="ring-legend">


            <div class="legend-item">

              <span
                class="legend-dot legend-time">
              </span>

              Time ${timePercent.toFixed(0)}%

            </div>


            <div class="legend-item">

              <span
                class="legend-dot legend-progress">
              </span>

              Invoice ${pct.toFixed(0)}%

            </div>


          </div>


          <div
            class="schedule-status ${schedule.className}">

            ${schedule.text}

          </div>

        `;

      }


      /* ===================================================
         BONUS CARDS KEEP NORMAL SINGLE RING
      =================================================== */

      else {

        card.innerHTML = `

          <div class="label">

            ${label}

          </div>


          <div class="value">

            ${pct.toFixed(1)}%

          </div>


          <div
            class="ring"
            style="--p:${pct}">
          </div>


          <div class="sub">

            Progress

          </div>

        `;

      }


      cards.appendChild(
        card
      );

    }
  );

}



/* =========================================================
   CSV PARSER
========================================================= */

function parseCSVLine(line) {

  const values = [];

  let current = "";

  let quoted = false;


  for (
    let i = 0;
    i < line.length;
    i++
  ) {

    const char =
      line[i];


    if (
      char === '"'
    ) {

      if (
        quoted &&
        line[i + 1] === '"'
      ) {

        current += '"';

        i++;

      }

      else {

        quoted =
          !quoted;

      }

    }

    else if (
      char === "," &&
      !quoted
    ) {

      values.push(
        current
      );

      current = "";

    }

    else {

      current +=
        char;

    }

  }


  values.push(
    current
  );


  return values;

}



/* =========================================================
   LOAD GOOGLE SHEET
========================================================= */

async function loadSheet() {

  const sync =
    document.getElementById(
      "sync"
    );


  try {

    sync.textContent =
      "Syncing Google Sheets...";


    const requestUrl =
      CSV_URL +
      "&_=" +
      Date.now();


    const response =
      await fetch(
        requestUrl,
        {
          method: "GET",
          cache: "no-store"
        }
      );


    if (
      !response.ok
    ) {

      throw new Error(
        "HTTP " +
        response.status
      );

    }


    const csvText =
      await response.text();


    const rows =
      csvText

        .replace(
          /^\uFEFF/,
          ""
        )

        .split(
          /\r?\n/
        )

        .filter(
          Boolean
        )

        .map(
          parseCSVLine
        );


    const expected =
      new Map(

        defaults.map(
          ([name]) => [

            name.toLowerCase(),

            name

          ]
        )

      );


    const newData =
      [];


    for (
      const row of rows
    ) {


      if (
        row.length < 2
      ) {

        continue;

      }


      const label =
        String(
          row[0] || ""
        )
        .trim();


      const key =
        label.toLowerCase();


      if (
        !expected.has(key)
      ) {

        continue;

      }


      let raw =
        String(
          row[1] || ""
        )

        .trim()

        .replace(
          "%",
          ""
        )

        .trim();


      let value =
        parseFloat(
          raw
        );


      if (
        Number.isNaN(
          value
        )
      ) {

        continue;

      }


      /*
        Google Sheets may return:

        70%

        OR

        0.7
      */


      if (
        value > 0 &&
        value <= 1
      ) {

        value =
          value * 100;

      }


      value =
        Math.round(
          value * 100
        ) / 100;


      newData.push(
        [

          expected.get(
            key
          ),

          value

        ]
      );

    }


    if (
      newData.length !== 5
    ) {

      throw new Error(

        "Expected 5 metrics, found " +

        newData.length

      );

    }


    data =
      newData;


    renderDashboard();


    sync.textContent =

      "Synced " +

      new Date()
        .toLocaleTimeString();


  }

  catch (error) {

    console.error(
      "Google Sheets sync error:",
      error
    );


    sync.innerHTML =

      '<span id="error">' +

      'Sheet sync error: ' +

      String(
        error.message ||
        error
      ) +

      '</span>';

  }

}



/* =========================================================
   CLOCK
========================================================= */

function updateClock() {

  document
    .getElementById(
      "clock"
    )
    .textContent =

      new Date()
        .toLocaleString();

}


setInterval(
  updateClock,
  1000
);



/* =========================================================
   START SIGNAGE
========================================================= */

renderDashboard();


loadSheet();


setInterval(
  loadSheet,
  REFRESH_MS
);


updateClock();


playCurrentAd();


</script>

</body>
</html>
